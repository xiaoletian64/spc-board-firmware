name: Build firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '固件版本号（留空则用日期+run号）'
        required: false
        type: string
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
env:
  IDF_IMAGE: espressif/idf:v5.4.2
  PROJECT_NAME: phone-hand

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Compute firmware version
        id: ver
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"; fi
          fi
          if [ -z "$V" ]; then V="$(date +%Y.%m.%d)-ci${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $V"

      - name: Build in official image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/project" -e VERSION -w /project "$IDF_IMAGE" bash -c '
            set -e
            . $IDF_PATH/export.sh
            # config.h 不进仓；CI 用占位值生成，运行时可用 USB 串口命令下发真实配置。
            cp -n main/config.h.example main/config.h
            idf.py -DIDF_TARGET=esp32s3 -DPROJECT_VER="$VERSION" -B build build
          '

      - name: Verify version is embedded
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ACTUAL=$(python3 - "build/$PROJECT_NAME.bin" "$VERSION" <<'PY'
          import sys
          blob = open(sys.argv[1], "rb").read(65536)
          want = sys.argv[2].encode()
          idx = blob.find(want)
          if idx < 0:
              print("NOT_FOUND")
          else:
              end = blob.find(b"\x00", idx)
              print(blob[idx:end].decode("utf-8", "replace"))
          PY
          )
          echo "embedded version: $ACTUAL (expected: $VERSION)"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::firmware version mismatch: got '$ACTUAL', expected '$VERSION'"
            exit 1
          fi

      - name: Verify OTA slot capacity
        run: |
          SZ=$(stat -c%s "build/$PROJECT_NAME.bin")
          echo "app.bin = $SZ bytes, OTA slot limit = 4128768"
          test "$SZ" -lt 4128768 || { echo "::error::firmware exceeds OTA slot size"; exit 1; }

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          cp build/$PROJECT_NAME.bin out/phone-hand.bin
          cp build/bootloader/bootloader.bin out/bootloader.bin
          cp build/partition_table/partition-table.bin out/partition-table.bin
          cp build/ota_data_initial.bin out/ota_data_initial.bin
          pip install esptool >/dev/null
          python -m esptool --chip esp32s3 merge-bin -o out/phone-hand-merged.bin \
            --flash_mode qio --flash_size 8MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x20000 build/$PROJECT_NAME.bin
          cd out && sha256sum *.bin | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: phone-hand-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "$GITHUB_REF_NAME" \
            --notes "phone-hand 固件 $GITHUB_REF_NAME。phone-hand-merged.bin 支持 0x0 一步烧录；phone-hand.bin 为 OTA 升级包。烧录方法见 README。"
