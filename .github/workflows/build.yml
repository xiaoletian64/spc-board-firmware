name: p4phonehub-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: adb protocol unit tests (PC)
        run: |
          gcc -Wall -Wextra -I components/adb_host/include \
            -o /tmp/adbtest test_host/test_protocol.c \
            components/adb_host/adb_protocol.c
          /tmp/adbtest

  idf-s3-atoms3u:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - name: build esp32s3 (AtomS3U lineage)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -n main/config.h.example main/config.h
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          esptool.py --chip esp32s3 merge_bin -o phone-hand-merged.bin \
            --flash_mode qio --flash_size 8MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x10000 build/phone-hand.bin
      - uses: actions/upload-artifact@v4
        with:
          name: atoms3u-bin
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/phone-hand.bin
            phone-hand-merged.bin
          retention-days: 7

  idf-p4-wifi6:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0
    steps:
      - uses: actions/checkout@v4
      - name: build esp32p4 (p4 hub)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -n main/config.h.example main/config.h
          . $IDF_PATH/export.sh
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32p4" set-target esp32p4
          idf.py build
      - name: merge p4 bins (single-file flash image)
        shell: bash
        run: |
          . $IDF_PATH/export.sh >/dev/null 2>&1
          python -m esptool --chip esp32p4 merge_bin -o build/p4-merged.bin \
            --flash_mode dio --flash_size 32MB --flash_freq 80m \
            0x2000 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x20000 build/phone-hand.bin
      - uses: actions/upload-artifact@v4
        with:
          name: p4wifi6-bin
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/phone-hand.bin
            build/p4-merged.bin
          retention-days: 7
